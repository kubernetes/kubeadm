# IMPORTANT! This workflow is imported by upgrade-etcd-rollback-* workflows.
version: 1
summary: |
  Verify etcd data rollback after a failed kubeadm upgrade.
  Regression test for https://github.com/kubernetes/kubeadm/issues/3330.
vars:
  kubernetesVersion: ci/latest
  baseImage: kindest/base:v20260214-ea8e5717
  image: kindest/node:etcd-rollback
  clusterName: kinder-upgrade-etcd-rollback
  kubeadmVerbosity: 6
tasks:
  - name: pull-base-image
    cmd: docker
    args:
      - pull
      - '{{ .vars.baseImage }}'
  - name: add-kubernetes-version
    cmd: kinder
    args:
      - build
      - node-image-variant
      - --base-image={{ .vars.baseImage }}
      - --image={{ .vars.image }}
      - --with-init-artifacts={{ .vars.kubernetesVersion }}
      - --loglevel=debug
    timeout: 15m
  - name: create-cluster
    cmd: kinder
    args:
      - create
      - cluster
      - --name={{ .vars.clusterName }}
      - --image={{ .vars.image }}
      - --control-plane-nodes=1
      - --worker-nodes=0
      - --loglevel=debug
    timeout: 5m
  - name: init
    cmd: kinder
    args:
      - do
      - kubeadm-init
      - --name={{ .vars.clusterName }}
      - --kubeadm-verbosity={{ .vars.kubeadmVerbosity }}
      - --loglevel=debug
    timeout: 5m
  - name: prepare-rollback-test
    description: Save an API object and the original etcd manifest/data marker, then prepare a failing etcd Pod patch.
    cmd: docker
    args:
      - exec
      - '{{ .vars.clusterName }}-control-plane-1'
      - bash
      - -ceu
      - |
        set -euo pipefail
        export KUBECONFIG=/etc/kubernetes/admin.conf
        state=/kinder/rollback
        data=/var/lib/etcd
        mkdir -p "${state}/patches"

        # Pull the fixture before taking etcd down; image pull failure must fail the job.
        crictl pull registry.k8s.io/e2e-test-images/busybox:1.37.0-2
        kubectl create configmap rollback-test --from-literal=value=before-upgrade
        kubectl get configmap rollback-test -o jsonpath='{.metadata.uid}:{.data.value}' > "${state}/object-before"
        cp /etc/kubernetes/manifests/etcd.yaml "${state}/etcd-before.yaml"
        printf 'before-upgrade\n' > "${state}/marker-before"
        cp "${state}/marker-before" "${data}/rollback-marker"
        touch "${state}/armed"

        # Kubeadm installs this patch after backup. Kubelet terminates the original
        # static Pod before starting its replacement, so the init container owns the
        # data directory exclusively. Preserve all DB/WAL bytes rather than truncating
        # a database file; the regular file at "member" makes old etcd require restore.
        cat > "${state}/patches/etcd+strategic.yaml" <<'PATCH'
        spec:
          initContainers:
          - name: fail-etcd-upgrade
            image: registry.k8s.io/e2e-test-images/busybox:1.37.0-2
            command:
            - /bin/sh
            - -ec
            - |
              test -f /rollback-state/armed
              test ! -e /rollback-state/fault-injected
              cmp /rollback-state/marker-before /var/lib/etcd/rollback-marker
              test -d /var/lib/etcd/member
              test ! -e /var/lib/etcd/member.failed-upgrade
              mv /var/lib/etcd/member /var/lib/etcd/member.failed-upgrade
              printf 'injected upgrade failure\n' > /var/lib/etcd/member
              printf 'after-backup\n' > /var/lib/etcd/rollback-marker
              printf 'created-after-backup\n' > /var/lib/etcd/rollback-extra
              printf 'injected\n' > /rollback-state/fault-injected
              exit 1
            volumeMounts:
            - name: etcd-data
              mountPath: /var/lib/etcd
            - name: rollback-state
              mountPath: /rollback-state
          volumes:
          - name: rollback-state
            hostPath:
              path: /kinder/rollback
              type: Directory
        PATCH

        version=$(kubeadm version -o short)
        printf '%s\n' "${version}" > "${state}/version"
        cat > "${state}/upgrade.yaml" <<CONFIG
        apiVersion: kubeadm.k8s.io/v1beta4
        kind: UpgradeConfiguration
        apply:
          kubernetesVersion: ${version}
          allowExperimentalUpgrades: true
          allowRCUpgrades: true
          forceUpgrade: true
          etcdUpgrade: true
          certificateRenewal: false
          patches:
            directory: ${state}/patches
        timeouts:
          upgradeManifests: 2m
          # Bound deliberately unhealthy etcd checks, including kubeadm's ten retries.
          etcdAPICall: 5s
        CONFIG
    timeout: 5m
  - name: fail-etcd-upgrade
    description: Run the real kubeadm upgrade and require both a nonzero exit code and completed fault injection.
    cmd: docker
    args:
      - exec
      - '{{ .vars.clusterName }}-control-plane-1'
      - bash
      - -ceu
      - |
        set -euo pipefail
        export KUBECONFIG=/etc/kubernetes/admin.conf
        state=/kinder/rollback
        data=/var/lib/etcd
        result=0
        kubeadm upgrade apply --config "${state}/upgrade.yaml" --v=6 > "${state}/upgrade.log" 2>&1 || result=$?
        printf '%s\n' "${result}" > "${state}/upgrade-exit-code"
        cat "${state}/upgrade.log"
        if [[ "${result}" -eq 0 ]]; then
          echo 'FAIL: upgrade unexpectedly succeeded' >&2
          exit 1
        fi
        # This acknowledgment is outside the data backup and is written only after
        # injection completes. A preflight error or an image-pull failure cannot pass.
        if [[ ! -s "${state}/fault-injected" ]]; then
          echo 'FAIL: upgrade failed before the fault injection completed' >&2
          exit 1
        fi
    timeout: 15m
  - name: verify-etcd-data-rollback
    description: Require the original manifest/data marker and removal of files created after backup.
    cmd: docker
    args:
      - exec
      - '{{ .vars.clusterName }}-control-plane-1'
      - bash
      - -ceu
      - |
        set -euo pipefail
        export KUBECONFIG=/etc/kubernetes/admin.conf
        state=/kinder/rollback
        data=/var/lib/etcd
        failed=0
        if ! cmp -s "${state}/etcd-before.yaml" /etc/kubernetes/manifests/etcd.yaml; then
          echo 'FAIL: original etcd manifest was not restored' >&2
          failed=1
        fi
        if ! cmp -s "${state}/marker-before" "${data}/rollback-marker"; then
          echo 'FAIL: original etcd data was not restored' >&2
          failed=1
        fi
        if [[ ! -d "${data}/member" || -e "${data}/member.failed-upgrade" || -e "${data}/rollback-extra" ]]; then
          echo 'FAIL: failed-upgrade files survived rollback' >&2
          failed=1
        fi
        if [[ -n "$(find "${data}" -mindepth 1 -maxdepth 1 -name 'kubeadm-backup-etcd-*')" ]]; then
          echo 'FAIL: backup was nested inside the live etcd directory' >&2
          failed=1
        fi
        # Fail on a broken restore without adding a second API-readiness timeout.
        [[ "${failed}" -eq 0 ]] || exit 1
    timeout: 1m
  - name: verify-api-recovery
    description: Wait for API recovery and verify that the original ConfigMap UID and value survived rollback.
    cmd: docker
    args:
      - exec
      - '{{ .vars.clusterName }}-control-plane-1'
      - bash
      - -ceu
      - |
        set -euo pipefail
        export KUBECONFIG=/etc/kubernetes/admin.conf
        state=/kinder/rollback
        data=/var/lib/etcd
        deadline=$((SECONDS + 180))
        until kubectl --request-timeout=5s get --raw=/readyz > /dev/null 2>&1; do
          if (( SECONDS >= deadline )); then
            echo 'FAIL: API server did not recover after rollback' >&2
            exit 1
          fi
          sleep 2
        done
        kubectl --request-timeout=10s get configmap rollback-test -o jsonpath='{.metadata.uid}:{.data.value}' > "${state}/object-after"
        cmp "${state}/object-before" "${state}/object-after"
    timeout: 4m
  - name: collect-rollback-diagnostics
    cmd: docker
    args:
      - exec
      - '{{ .vars.clusterName }}-control-plane-1'
      - bash
      - -ceu
      - |
        mkdir -p /kinder/rollback
        find /var/lib/etcd -maxdepth 6 -type f -printf '%p %s bytes\n' > /kinder/rollback/data-files.txt
        find /var/lib/etcd -maxdepth 1 -printf '%f %y\n' > /kinder/rollback/data-entries.txt
        crictl ps -a > /kinder/rollback/containers.txt
    force: true
    ignoreError: true
  - name: export-rollback-diagnostics
    cmd: docker
    args:
      - cp
      - '{{ .vars.clusterName }}-control-plane-1:/kinder/rollback'
      - '{{ .env.ARTIFACTS }}/etcd-rollback'
    force: true
    ignoreError: true
  - name: get-logs
    cmd: kinder
    args:
      - export
      - logs
      - --name={{ .vars.clusterName }}
      - --loglevel=debug
      - '{{ .env.ARTIFACTS }}'
    force: true
    timeout: 5m
    ignoreError: true
  - name: delete
    cmd: kinder
    args:
      - delete
      - cluster
      - --name={{ .vars.clusterName }}
      - --loglevel=debug
    force: true
